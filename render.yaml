services:
  - type: web
    name: windpilot-entropy
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python scripts/restore_runtime.py
    startCommand: python -m uvicorn windpilot.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WINDPILOT_AUTO_REFRESH_SECONDS
        value: "900"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
